name: Refresh Tip-Off Ledger

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: pbp_cache
          key: pbp-${{ github.run_id }}
          restore-keys: pbp-

      - name: Refresh data
        id: build
        continue-on-error: true
        run: python build_data.py --source nba --html tipoff_ledger.html --out data.json

      - name: Save pre-tip flags
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain flags.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add flags.json
            git commit -m "Record pre-tip availability flags"
            git pull --rebase
            git push
          fi

      - name: Assemble site
        run: |
          mkdir -p _site
          cp tipoff_ledger.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Report a failed refresh
        if: steps.build.outcome == 'failure'
        run: |
          echo "The NBA refresh failed; the page was published with its previous data." >> "$GITHUB_STEP_SUMMARY"
          exit 1
