name: Refresh Tip-Off Ledger

on:
  schedule:
    - cron: "*/5 * * * *"        # every 5 minutes (the most often GitHub allows)
  workflow_dispatch:            # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # play-by-play already downloaded on earlier runs
      - uses: actions/cache@v4
        with:
          path: pbp_cache
          key: pbp-${{ github.run_id }}
          restore-keys: pbp-

      # Pull new games and the schedule from the NBA API into the page.
      # If the API cannot be reached, publish the page as it is rather than nothing.
      - name: Refresh data
        id: build
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python build_data.py --source nba --html tipoff_ledger.html --out data.json

      # Work out tonight's threes picks with the page's own model and lock each game's picks and numbers when it tips off.
      - name: Lock picks
        id: lock
        continue-on-error: true
        run: node lock_picks.js tipoff_ledger.html picks.json

      # Keep what was flagged before each game (flags.json), the prices fetched (odds.json) and the locked picks (picks.json) in the repository.
      - name: Save pre-tip flags, prices and picks
        id: save
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain flags.json odds.json picks.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for f in flags.json odds.json picks.json; do [ -f "$f" ] && git add "$f"; done
            git commit -m "Record pre-tip flags, prices and picks"
            # the refreshed page is still modified in the working copy, so a plain pull would refuse to run
            git push || (git pull --rebase --autostash && git push)
          fi

      - name: Assemble site
        run: |
          mkdir -p _site
          cp tipoff_ledger.html _site/index.html
          if [ -d "NBA Logos" ]; then cp -r "NBA Logos" _site/; fi   # team logos shown beside team names
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Report a failed save
        if: steps.save.outcome == 'failure'
        run: |
          echo "Saving flags.json / odds.json / picks.json to the repository failed; prices, flags and locked picks from this run were not kept." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Report a failed lock
        if: steps.lock.outcome == 'failure'
        run: |
          echo "Locking picks failed; the page was published without tonight's locks." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Report a failed refresh
        if: steps.build.outcome == 'failure'
        run: |
          echo "The NBA refresh failed; the page was published with its previous data." >> "$GITHUB_STEP_SUMMARY"
          exit 1
